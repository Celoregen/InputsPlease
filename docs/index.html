<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>《请输入文本》· 第三方下载站</title>
        <link rel="icon" href="/img/ico.svg">
        <meta name="description" content="《请输入文本》—— 一方文学的自留地。创刊号现已发布，下载阅读，欢迎投稿。">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;700&family=Noto+Serif+SC:wght@300;900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="style_index.css">
    </head>
    <body>
        <div class="background">

            <!-- 顶部导航栏 -->
            <header>
                <div class="ico-space">
                    <span class="web-title">《请输入文本》</span>
                    <span class="web-slogan">我们的文学自留地</span>
                </div>
                <nav>
                    <a href="/index.html" class="navigation-button">最新一期</a>
                    <a href="/section.html" class="navigation-button">栏目导览</a>
                    <a href="/previous.html" class="navigation-button">往期下载</a>
                    <a href="https://github.com/Celoregen/InputsPlease" class="navigation-button">Github</a>
                </nav>
            </header>

            <!-- 最新一期下载主体 -->
             <section class="body-container">
                <div class="cover-part">
                    <div class="img-head">
                        <div class="img-word">最新一期</div>
                        <div class="img-meta">创刊号 · 2026 Vol.1 · 季刊</div>
                    </div>
                    <div class="img-body">
                        <div class="img-tap"> </div>
                        <img src="img/cover.jpeg" alt="请输入文本 · 最新一期封面" class="img-cover">
                    </div>
                </div>

                <div class="button-part">
                    <div class="title">《请输入文本》</div>
                    <div class="title-en">PLEASE ENTER TEXT</div>
                    <div class="subtitle">—— 你负责打字，剩下的交给我们</div>
                    <p class="introduction">文本框装不下八千份稿子，于是它变成了一本杂志。</p>
                    <div class="download-button-container">
                        <a href="/download/publication.pdf" class="download-button" download="请输入文本|创刊号.pdf">↓ 下载最新一期·PDF</a>
                    </div>
                    <div class="file-information" id="file-info">文件信息</div>
                    <p class="notice">感谢每一个热爱创作的你。</p>
                </div>
             </section>

            <!-- 网站脚注 -->
             <footer>
                <p>
                    © 2026 请输入文本 · Celoregen 由 <a href="https://github.com/Celoregen/InputsPlease" target="">GitHub</a> 托管
                </p>
                <p >
                    <a href="https://github.com/Celoregen/InputsPlease/releases" target="_blank">历史版本</a> ·  
                    <a href="https://github.com/Celoregen/InputsPlease/issues" target="_blank">问题反馈</a>
                </p>
             </footer>
        </div>
    </body>

    <script>
        
        const fileInfo = document.getElementById('file-info');

            (async () => {

                try {

                    fileInfo.textContent = '请求中...';

                    const res = await fetch('https://api.github.com/repos/Celoregen/InputsPlease/releases/latest');

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const data = await res.json();

                    const asset = data.assets?.find(a => a.name === 'publication.pdf');

                    const sizeBytes = asset?.size ?? 0;

                    const format = asset?.name?.split('.').pop()?.toUpperCase() ?? 'UNKNOWN';

                    const downloads = asset?.download_count ?? 0;

                    const sizeStr = sizeBytes > 1048576

                    ? `${(sizeBytes / 1048576).toFixed(1)} MB`

                    : `${(sizeBytes / 1024).toFixed(1)} KB`;

                    fileInfo.textContent = `${sizeStr} · ${format} · ↓${downloads.toLocaleString()}`;

                } catch (err) {

                    fileInfo.textContent = '文件属性获取失败';

                } finally {

                    console.log('请求完成');

            }
            
        })();

    </script>

</html>
